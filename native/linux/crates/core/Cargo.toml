[package]
name = "family-guide-core"
version = "1.0.0"
edition = "2021"
description = "Pure Rust offline data model, AES-256-GCM/PBKDF2/Shamir crypto, readiness audit, search, and two-spouse smart merge for Our Family Field Guide."
license = "MIT"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
