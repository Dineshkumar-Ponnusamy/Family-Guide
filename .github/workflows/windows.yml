name: Build Windows App (C# + .NET 8 + WPF)

on:
  push:
    branches: [main]
    paths:
      - "native/windows/**"
      - "shared/guide-data.json"
      - "shared/sync_schema.py"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "native/windows/**"
      - "shared/guide-data.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python & sync shared schema JSON
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python shared/sync_schema.py

      - name: Run C# Core xUnit tests
        run: dotnet test native/windows/FamilyGuide.Core.Tests/FamilyGuide.Core.Tests.csproj -c Release

      - name: Publish self-contained single-file Windows .exe
        run: dotnet publish native/windows/FamilyGuide.Windows/FamilyGuide.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o native/windows/publish

      - name: Verify Compiled Single-File Windows .exe
        shell: pwsh
        run: |
          $isoDir = "$env:TEMP\ffg-win-isolated"
          if (Test-Path $isoDir) { Remove-Item $isoDir -Recurse -Force }
          New-Item -ItemType Directory -Path $isoDir | Out-Null
          $exe = Join-Path $isoDir "FamilyFieldGuide.exe"
          Copy-Item .\native\windows\publish\FamilyFieldGuide.exe $exe
          $outFile = "$env:TEMP\ffg-win-smoke.txt"
          if (Test-Path $outFile) { Remove-Item $outFile -Force }
          $proc = Start-Process -FilePath $exe -ArgumentList "--smoke-test-out=$outFile" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Windows smoke test exited with $($proc.ExitCode)" }
          $txt = Get-Content $outFile -Raw
          Write-Output $txt
          if ($txt -notmatch "WINDOWS_APP_SMOKE_TEST_PASSED") { throw "Missing smoke pass marker" }

          $gui = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 4
          if ($gui.HasExited) { throw "Windows GUI exited prematurely with $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force
          Remove-Item $isoDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-field-guide-windows-x64
          path: native/windows/publish/FamilyFieldGuide.exe
