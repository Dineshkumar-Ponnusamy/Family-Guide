name: Build Android App (Kotlin + Jetpack Compose)

on:
  push:
    branches: [main]
    paths:
      - "native/android/**"
      - "shared/guide-data.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - "shared/guide-data.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Sync shared schema JSON
        run: python3 shared/sync_schema.py

      - name: Run unit tests & build debug APK
        working-directory: native/android
        run: gradle testDebugUnitTest assembleDebug

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-field-guide-android-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
