name: Build Android App (Kotlin + Jetpack Compose)

on:
  push:
    branches: [main]
    paths:
      - "native/android/**"
      - "shared/guide-data.json"
      - "shared/sync_schema.py"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "native/android/**"
      - "shared/guide-data.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Sync shared schema JSON
        run: python3 shared/sync_schema.py

      - name: Run unit tests & build debug APK
        working-directory: native/android
        run: gradle testDebugUnitTest assembleDebug

      - name: Verify APK manifest, assets & zero unexpected permissions
        run: |
          APK="native/android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK" > /tmp/apk-badging.txt
          grep -q "package: name='io.github.dineshkumarponnusamy.familyfieldguide'" /tmp/apk-badging.txt
          grep -q "launchable-activity:" /tmp/apk-badging.txt
          BAD_PERMS=$(grep "uses-permission:" /tmp/apk-badging.txt | grep -vE "'android\.permission\.USE_BIOMETRIC'|'android\.permission\.USE_FINGERPRINT'|'io\.github\.dineshkumarponnusamy\.familyfieldguide\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
          if [ -n "$BAD_PERMS" ]; then
            echo "ERROR: Android APK declared unexpected permissions:"
            echo "$BAD_PERMS"
            exit 1
          fi
          unzip -l "$APK" | grep -q "assets/guide-data.json"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: family-field-guide-android-debug
          path: native/android/app/build/outputs/apk/debug/*.apk
