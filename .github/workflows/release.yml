name: Release All Platforms

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  web-bundle:
    name: Web / PWA Offline Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Web & Cross-Platform Parity Tests
        run: |
          node tests/web_tests.js
          python3 tests/test_design_parity.py

      - name: Package Offline Web / PWA Zip
        run: |
          mkdir -p web-pkg/Our-Family-Field-Guide-Web
          cp index.html styles.css schema.js regions.js app.js manifest.json sw.js \
             icon.svg icon-192.png icon-512.png apple-touch-icon.png \
             README.md LICENSE SECURITY.md web-pkg/Our-Family-Field-Guide-Web/
          (cd web-pkg && zip -r ../Our-Family-Field-Guide-Web-Offline.zip Our-Family-Field-Guide-Web)

      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: Our-Family-Field-Guide-Web-Offline.zip

  macos-and-ios:
    name: Apple (macOS .dmg & iOS Source)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema & run Apple Swift tests
        run: |
          python3 shared/sync_schema.py
          swift test --package-path native/apple

      - name: Build macOS .app bundle & DMG
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          swift build --package-path native/apple --product FamilyGuideMac -c release
          BIN_DIR=$(swift build --package-path native/apple --product FamilyGuideMac -c release --show-bin-path)
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          mkdir -p AppIcon.iconset
          sips -z 16 16     icon-512.png --out AppIcon.iconset/icon_16x16.png > /dev/null
          sips -z 32 32     icon-512.png --out AppIcon.iconset/icon_16x16@2x.png > /dev/null
          sips -z 32 32     icon-512.png --out AppIcon.iconset/icon_32x32.png > /dev/null
          sips -z 64 64     icon-512.png --out AppIcon.iconset/icon_32x32@2x.png > /dev/null
          sips -z 128 128   icon-512.png --out AppIcon.iconset/icon_128x128.png > /dev/null
          sips -z 256 256   icon-512.png --out AppIcon.iconset/icon_128x128@2x.png > /dev/null
          sips -z 256 256   icon-512.png --out AppIcon.iconset/icon_256x256.png > /dev/null
          sips -z 512 512   icon-512.png --out AppIcon.iconset/icon_256x256@2x.png > /dev/null
          sips -z 512 512   icon-512.png --out AppIcon.iconset/icon_512x512.png > /dev/null
          cp icon-512.png AppIcon.iconset/icon_512x512@2x.png
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

          APP_DIR="dmg-stage/Our Family Field Guide.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BIN_DIR/FamilyGuideMac" "$APP_DIR/Contents/MacOS/FamilyGuideMac"
          cp -R "$BIN_DIR/FamilyFieldGuide_FamilyGuideCore.bundle" "$APP_DIR/Contents/Resources/"
          cp AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Our Family Field Guide</string>
            <key>CFBundleDisplayName</key><string>Our Family Field Guide</string>
            <key>CFBundleIdentifier</key><string>io.github.dineshkumarponnusamy.familyfieldguide</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>FamilyGuideMac</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP_DIR"
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Our Family Field Guide" -srcfolder dmg-stage -ov -format UDZO -fs HFS+ Our-Family-Field-Guide-macOS-arm64.dmg

      - name: Package iOS Swift Package & Xcode Source Bundle
        run: |
          mkdir -p ios-pkg/Our-Family-Field-Guide-iOS
          cp -R native/apple/* ios-pkg/Our-Family-Field-Guide-iOS/
          rm -rf ios-pkg/Our-Family-Field-Guide-iOS/.build ios-pkg/Our-Family-Field-Guide-iOS/.swiftpm
          cp shared/BACKUP_FORMAT.md LICENSE ios-pkg/Our-Family-Field-Guide-iOS/
          (cd ios-pkg && zip -r ../Our-Family-Field-Guide-iOS-Xcode-Source.zip Our-Family-Field-Guide-iOS)

      - uses: actions/upload-artifact@v4
        with:
          name: release-apple
          path: |
            Our-Family-Field-Guide-macOS-arm64.dmg
            Our-Family-Field-Guide-iOS-Xcode-Source.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Sync schema, test & build Android APK
        run: python3 shared/sync_schema.py

      - working-directory: native/android
        run: gradle testDebugUnitTest assembleDebug

      - name: Stage release APK
        run: cp native/android/app/build/outputs/apk/debug/app-debug.apk Our-Family-Field-Guide-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: Our-Family-Field-Guide-Android.apk

  windows:
    name: Windows (Single-File .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync shared schema JSON
        run: python shared/sync_schema.py

      - name: Run C# Core xUnit tests
        run: dotnet test native/windows/FamilyGuide.Core.Tests/FamilyGuide.Core.Tests.csproj -c Release

      - name: Publish self-contained single-file Windows .exe
        run: dotnet publish native/windows/FamilyGuide.Windows/FamilyGuide.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o native/windows/publish

      - name: Stage Windows release .exe
        run: Copy-Item native/windows/publish/FamilyFieldGuide.exe Our-Family-Field-Guide-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: Our-Family-Field-Guide-Windows-x64.exe

  linux:
    name: Linux (GTK4 .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 development libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev pkg-config build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema
        run: python3 shared/sync_schema.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/linux

      - name: Run Rust Core tests & build GTK4 release binary
        run: |
          cargo test --manifest-path native/linux/Cargo.toml -p family-guide-core
          cargo build --manifest-path native/linux/Cargo.toml --release -p family-guide-gtk

      - name: Package Linux tar.gz bundle
        run: |
          PKG="linux-pkg/our-family-field-guide-linux-x86_64"
          mkdir -p "$PKG"
          cp native/linux/target/release/family-field-guide "$PKG/"
          cp native/linux/family-field-guide.desktop "$PKG/"
          cp icon.svg "$PKG/family-field-guide.svg"
          cp native/linux/README.md "$PKG/README.md"
          cp LICENSE "$PKG/LICENSE"
          cat > "$PKG/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          install -Dm755 "$HERE/family-field-guide" "${HOME}/.local/bin/family-field-guide"
          install -Dm644 "$HERE/family-field-guide.svg" "${HOME}/.local/share/icons/hicolor/scalable/apps/family-field-guide.svg"
          install -Dm644 "$HERE/family-field-guide.desktop" "${HOME}/.local/share/applications/family-field-guide.desktop"
          echo "Installed Our Family Field Guide to ~/.local/bin/family-field-guide"
          EOF
          chmod +x "$PKG/install.sh"
          tar -czf Our-Family-Field-Guide-Linux-x86_64.tar.gz -C linux-pkg our-family-field-guide-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: Our-Family-Field-Guide-Linux-x86_64.tar.gz

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [web-bundle, macos-and-ios, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          (cd release-assets && sha256sum Our-Family-Field-Guide-* > SHA256SUMS.txt)
          ls -lh release-assets

          cat > /tmp/release-notes.md <<'NOTES'
          ## Our Family Field Guide — Multi-Platform Release

          A private, **100% offline** emergency, medical care & digital legacy guide for the people you love. Zero servers, zero telemetry, and byte-for-byte **AES-256-GCM** + **2-of-3 Shamir** interoperable backups across every platform.

          ### Downloads

          | Platform | Package | Install / Run Notes |
          |---|---|---|
          | **Web / PWA (Any OS)** | `Our-Family-Field-Guide-Web-Offline.zip` | Or open the [Live Web App](https://dineshkumar-ponnusamy.github.io/Family-Guide/) directly — zero install needed |
          | **macOS (Apple Silicon)** | `Our-Family-Field-Guide-macOS-arm64.dmg` | Drag **Our Family Field Guide.app** to Applications *(Right-click → Open on first launch if ad-hoc signed)* |
          | **iOS (iPhone / iPad)** | `Our-Family-Field-Guide-iOS-Xcode-Source.zip` | Pure SwiftUI + Face ID package (`native/apple/`) ready to build onto iOS 17+ in Xcode |
          | **Android (8.0+)** | `Our-Family-Field-Guide-Android.apk` | Pure Kotlin + Jetpack Compose with **zero `INTERNET` permission** in `AndroidManifest.xml` |
          | **Windows (x64)** | `Our-Family-Field-Guide-Windows-x64.exe` | Self-contained portable `.exe` (requires no separate .NET runtime) |
          | **Linux (x86_64 GTK4)** | `Our-Family-Field-Guide-Linux-x86_64.tar.gz` | Run `./install.sh` to install binary, icon & `.desktop` launcher (`libgtk-4-dev` / `gtk4` runtime) |
          | **Checksums** | `SHA256SUMS.txt` | Verify integrity with `sha256sum -c SHA256SUMS.txt` |

          ### Privacy & Cryptography Highlights
          - **Zero telemetry, zero accounts, zero cloud dependencies** across all 6 apps.
          - **Byte-for-byte compatible encrypted backups:** `PBKDF2-HMAC-SHA256` (250,000 rounds, 16-byte salt) + `AES-256-GCM` (12-byte IV, `ciphertext || 16-byte tag`), plus `GF(256)` 2-of-3 Shamir Split Recovery Cards (`FFG-1-...`).
          - **Built-in Readiness Audits:** Flags accidental raw crypto seed phrases and full national IDs (SSN / Aadhaar).
          NOTES

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Our Family Field Guide $TAG_NAME" --notes-file /tmp/release-notes.md
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "Our Family Field Guide $TAG_NAME" --notes-file /tmp/release-notes.md --latest
          fi
