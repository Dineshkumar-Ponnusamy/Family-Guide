name: Release All Platforms

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  web-bundle:
    name: Web / PWA Offline Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Web & Cross-Platform Parity Tests
        run: |
          node tests/web_tests.js
          python3 tests/test_design_parity.py

      - name: Package Offline Web / PWA Zip
        run: |
          mkdir -p web-pkg/Our-Family-Field-Guide-Web
          cp index.html styles.css schema.js regions.js crypto.js standalone.js app.js manifest.json sw.js \
             icon.svg icon-192.png icon-512.png apple-touch-icon.png \
             README.md LICENSE SECURITY.md web-pkg/Our-Family-Field-Guide-Web/
          (cd web-pkg && zip -r ../Our-Family-Field-Guide-Web-Offline.zip Our-Family-Field-Guide-Web)

      - name: Verify Offline Web / PWA Zip
        run: |
          rm -rf /tmp/ffg-web-verify
          unzip -q Our-Family-Field-Guide-Web-Offline.zip -d /tmp/ffg-web-verify
          for f in index.html styles.css schema.js regions.js crypto.js standalone.js app.js manifest.json sw.js icon.svg icon-192.png icon-512.png apple-touch-icon.png; do
            test -s "/tmp/ffg-web-verify/Our-Family-Field-Guide-Web/$f"
          done
          rm -rf /tmp/ffg-web-verify

      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: Our-Family-Field-Guide-Web-Offline.zip

  macos-and-ios:
    name: Apple (macOS .dmg & iOS Source)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema & run Apple Swift tests
        run: |
          python3 shared/sync_schema.py
          swift test --package-path native/apple

      - name: Build macOS .app bundle & DMG
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          swift build --package-path native/apple --product FamilyGuideMac -c release
          BIN_DIR=$(swift build --package-path native/apple --product FamilyGuideMac -c release --show-bin-path)
          VERSION="${TAG_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          mkdir -p AppIcon.iconset
          sips -z 16 16     icon-512.png --out AppIcon.iconset/icon_16x16.png > /dev/null
          sips -z 32 32     icon-512.png --out AppIcon.iconset/icon_16x16@2x.png > /dev/null
          sips -z 32 32     icon-512.png --out AppIcon.iconset/icon_32x32.png > /dev/null
          sips -z 64 64     icon-512.png --out AppIcon.iconset/icon_32x32@2x.png > /dev/null
          sips -z 128 128   icon-512.png --out AppIcon.iconset/icon_128x128.png > /dev/null
          sips -z 256 256   icon-512.png --out AppIcon.iconset/icon_128x128@2x.png > /dev/null
          sips -z 256 256   icon-512.png --out AppIcon.iconset/icon_256x256.png > /dev/null
          sips -z 512 512   icon-512.png --out AppIcon.iconset/icon_256x256@2x.png > /dev/null
          sips -z 512 512   icon-512.png --out AppIcon.iconset/icon_512x512.png > /dev/null
          sips -z 1024 1024 icon-512.png --out AppIcon.iconset/icon_512x512@2x.png > /dev/null
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

          APP_DIR="dmg-stage/Our Family Field Guide.app"
          mkdir -p "$APP_DIR/Contents/MacOS" "$APP_DIR/Contents/Resources"
          cp "$BIN_DIR/FamilyGuideMac" "$APP_DIR/Contents/MacOS/FamilyGuideMac"
          cp -R "$BIN_DIR/FamilyFieldGuide_FamilyGuideCore.bundle" "$APP_DIR/Contents/Resources/"
          cp native/apple/Sources/FamilyGuideCore/Resources/guide-data.json "$APP_DIR/Contents/Resources/guide-data.json"
          cp AppIcon.icns "$APP_DIR/Contents/Resources/AppIcon.icns"

          cat > "$APP_DIR/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Our Family Field Guide</string>
            <key>CFBundleDisplayName</key><string>Our Family Field Guide</string>
            <key>CFBundleIdentifier</key><string>io.github.dineshkumarponnusamy.familyfieldguide</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>FamilyGuideMac</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.utilities</string>
          </dict>
          </plist>
          PLIST

          codesign --force --deep --sign - "$APP_DIR"
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "Our Family Field Guide" -srcfolder dmg-stage -ov -format UDZO -fs HFS+ Our-Family-Field-Guide-macOS-arm64.dmg

      - name: Verify macOS DMG, Packaged App & iOS Simulator Build
        run: |
          MNT="/tmp/ffg-mac-mnt"
          rm -rf "$MNT"
          mkdir -p "$MNT"
          hdiutil attach Our-Family-Field-Guide-macOS-arm64.dmg -nobrowse -readonly -mountpoint "$MNT"
          trap 'hdiutil detach "$MNT" -quiet || true' EXIT
          codesign --verify --deep --strict "$MNT/Our Family Field Guide.app"
          SMOKE_OUT="$("$MNT/Our Family Field Guide.app/Contents/MacOS/FamilyGuideMac" --smoke-test)"
          echo "$SMOKE_OUT"
          echo "$SMOKE_OUT" | grep -q "MAC_APP_SMOKE_TEST_PASSED"
          "$MNT/Our Family Field Guide.app/Contents/MacOS/FamilyGuideMac" >/tmp/mac-gui.log 2>&1 &
          GUI_PID=$!
          sleep 3
          kill -0 "$GUI_PID"
          kill "$GUI_PID" || true
          wait "$GUI_PID" 2>/dev/null || true
          hdiutil detach "$MNT" -quiet
          trap - EXIT
          (cd native/apple && xcodebuild -scheme FamilyGuideUI -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build)

      - name: Package iOS Swift Package & Xcode Source Bundle
        run: |
          mkdir -p ios-pkg/Our-Family-Field-Guide-iOS
          cp -R native/apple/* ios-pkg/Our-Family-Field-Guide-iOS/
          rm -rf ios-pkg/Our-Family-Field-Guide-iOS/.build ios-pkg/Our-Family-Field-Guide-iOS/.swiftpm
          cp shared/BACKUP_FORMAT.md LICENSE ios-pkg/Our-Family-Field-Guide-iOS/
          (cd ios-pkg && zip -r ../Our-Family-Field-Guide-iOS-Xcode-Source.zip Our-Family-Field-Guide-iOS)

      - uses: actions/upload-artifact@v7
        with:
          name: release-apple
          path: |
            Our-Family-Field-Guide-macOS-arm64.dmg
            Our-Family-Field-Guide-iOS-Xcode-Source.zip

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Sync schema, test & build Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 shared/sync_schema.py
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "Building signed release APK..."
            trap 'rm -f /tmp/ffg-release.jks' EXIT
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/ffg-release.jks
            export FFG_KEYSTORE_PATH="/tmp/ffg-release.jks"
            export FFG_KEYSTORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            export FFG_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export FFG_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            (cd native/android && gradle testDebugUnitTest assembleRelease)
            cp native/android/app/build/outputs/apk/release/app-release.apk Our-Family-Field-Guide-Android.apk
          else
            echo "Keystore secrets not configured; building preview debug APK..."
            (cd native/android && gradle testDebugUnitTest assembleDebug)
            cp native/android/app/build/outputs/apk/debug/app-debug.apk Our-Family-Field-Guide-Android-PREVIEW-debug.apk
          fi

      - name: Verify Android APK manifest, assets & zero unexpected permissions
        run: |
          if [ -f Our-Family-Field-Guide-Android.apk ]; then
            APK_FILE="Our-Family-Field-Guide-Android.apk"
          else
            APK_FILE="Our-Family-Field-Guide-Android-PREVIEW-debug.apk"
          fi
          test -f "$APK_FILE"
          AAPT2=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump badging "$APK_FILE" > /tmp/apk-badging.txt
          head -n 20 /tmp/apk-badging.txt
          grep -q "package: name='io.github.dineshkumarponnusamy.familyfieldguide'" /tmp/apk-badging.txt
          grep -q "launchable-activity:" /tmp/apk-badging.txt
          BAD_PERMS=$(grep "uses-permission:" /tmp/apk-badging.txt | grep -vE "'android\.permission\.USE_BIOMETRIC'|'android\.permission\.USE_FINGERPRINT'|'io\.github\.dineshkumarponnusamy\.familyfieldguide\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" || true)
          if [ -n "$BAD_PERMS" ]; then
            echo "ERROR: Android APK declared unexpected permissions:"
            echo "$BAD_PERMS"
            exit 1
          fi
          unzip -l "$APK_FILE" | grep -q "assets/guide-data.json"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: Our-Family-Field-Guide-Android*.apk

  windows:
    name: Windows (Single-File .exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync shared schema JSON
        run: python shared/sync_schema.py

      - name: Run C# Core xUnit tests
        run: dotnet test native/windows/FamilyGuide.Core.Tests/FamilyGuide.Core.Tests.csproj -c Release

      - name: Publish self-contained single-file Windows .exe
        run: dotnet publish native/windows/FamilyGuide.Windows/FamilyGuide.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o native/windows/publish

      - name: Stage Windows release .exe
        run: Copy-Item native/windows/publish/FamilyFieldGuide.exe Our-Family-Field-Guide-Windows-x64.exe

      - name: Verify Compiled Single-File Windows .exe
        shell: pwsh
        run: |
          $outFile = "$env:TEMP\ffg-win-smoke.txt"
          if (Test-Path $outFile) { Remove-Item $outFile -Force }
          $proc = Start-Process -FilePath ".\Our-Family-Field-Guide-Windows-x64.exe" -ArgumentList "--smoke-test-out=$outFile" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Windows smoke test exited with $($proc.ExitCode)" }
          $txt = Get-Content $outFile -Raw
          Write-Output $txt
          if ($txt -notmatch "WINDOWS_APP_SMOKE_TEST_PASSED") { throw "Missing smoke pass marker" }

          $gui = Start-Process -FilePath ".\Our-Family-Field-Guide-Windows-x64.exe" -PassThru
          Start-Sleep -Seconds 4
          if ($gui.HasExited) { throw "Windows GUI exited prematurely with $($gui.ExitCode)" }
          Stop-Process -Id $gui.Id -Force

      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: Our-Family-Field-Guide-Windows-x64.exe

  linux:
    name: Linux (GTK4 .tar.gz)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK4 development libraries
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends libgtk-4-dev pkg-config build-essential xvfb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema
        run: python3 shared/sync_schema.py

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/linux

      - name: Run Rust Core tests & build GTK4 release binary
        run: |
          cargo test --manifest-path native/linux/Cargo.toml -p family-guide-core
          cargo build --manifest-path native/linux/Cargo.toml --release -p family-guide-gtk

      - name: Package Linux tar.gz bundle
        run: |
          PKG="linux-pkg/our-family-field-guide-linux-x86_64"
          mkdir -p "$PKG"
          cp native/linux/target/release/family-field-guide "$PKG/"
          cp native/linux/family-field-guide.desktop "$PKG/"
          cp icon.svg "$PKG/family-field-guide.svg"
          cp native/linux/README.md "$PKG/README.md"
          cp LICENSE "$PKG/LICENSE"
          cat > "$PKG/install.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          install -Dm755 "$HERE/family-field-guide" "${HOME}/.local/bin/family-field-guide"
          install -Dm644 "$HERE/family-field-guide.svg" "${HOME}/.local/share/icons/hicolor/scalable/apps/family-field-guide.svg"
          install -Dm644 "$HERE/family-field-guide.desktop" "${HOME}/.local/share/applications/family-field-guide.desktop"
          echo "Installed Our Family Field Guide to ~/.local/bin/family-field-guide"
          EOF
          chmod +x "$PKG/install.sh"
          tar -czf Our-Family-Field-Guide-Linux-x86_64.tar.gz -C linux-pkg our-family-field-guide-linux-x86_64

      - name: Verify Packaged Linux GTK4 Binary
        run: |
          rm -rf /tmp/ffg-linux-verify
          mkdir -p /tmp/ffg-linux-verify
          tar -xzf Our-Family-Field-Guide-Linux-x86_64.tar.gz -C /tmp/ffg-linux-verify
          BIN="/tmp/ffg-linux-verify/our-family-field-guide-linux-x86_64/family-field-guide"
          SMOKE_OUT="$("$BIN" --smoke-test)"
          echo "$SMOKE_OUT"
          echo "$SMOKE_OUT" | grep -q "LINUX_APP_SMOKE_TEST_PASSED"
          xvfb-run -a "$BIN" >/tmp/linux-gui.log 2>&1 &
          GUI_PID=$!
          sleep 3
          kill -0 "$GUI_PID"
          kill "$GUI_PID" || true
          wait "$GUI_PID" 2>/dev/null || true
          rm -rf /tmp/ffg-linux-verify

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: Our-Family-Field-Guide-Linux-x86_64.tar.gz

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [web-bundle, macos-and-ios, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          (cd release-assets && sha256sum Our-Family-Field-Guide-* > SHA256SUMS.txt)
          ls -lh release-assets

          if [ -f release-assets/Our-Family-Field-Guide-Android.apk ]; then
            export ANDROID_APK_NAME="Our-Family-Field-Guide-Android.apk"
            export ANDROID_APK_NOTE="signed release APK"
          else
            export ANDROID_APK_NAME="Our-Family-Field-Guide-Android-PREVIEW-debug.apk"
            export ANDROID_APK_NOTE="debug-signed preview APK; cannot upgrade a signed release in place"
          fi

          cat > /tmp/release-notes.md <<'NOTES'
          ## Our Family Field Guide — Multi-Platform Release

          A private, **100% offline** emergency, medical care & digital legacy guide for the people you love. Zero servers, zero telemetry, and byte-for-byte **AES-256-GCM** + **2-of-3 Shamir** interoperable backups across every platform.

          ### Downloads

          | Platform | Package | Install / Run Notes |
          |---|---|---|
          | **Web / PWA (Any OS)** | `Our-Family-Field-Guide-Web-Offline.zip` | Or open the [Live Web App](https://dineshkumar-ponnusamy.github.io/Family-Guide/) directly — zero install needed |
          | **macOS (Apple Silicon)** | `Our-Family-Field-Guide-macOS-arm64.dmg` | Drag **Our Family Field Guide.app** to Applications *(Ad-hoc signed; allow via System Settings → Privacy & Security → Open Anyway)* |
          | **iOS (iPhone / iPad)** | `Our-Family-Field-Guide-iOS-Xcode-Source.zip` | Pure SwiftUI + Face ID package (`native/apple/`) ready to build onto iOS 17+ in Xcode |
          | **Android (8.0+)** | `__ANDROID_APK_NAME__` | Pure Kotlin + Jetpack Compose with **zero `INTERNET` permission** in `AndroidManifest.xml` *(__ANDROID_APK_NOTE__)* |
          | **Windows (x64)** | `Our-Family-Field-Guide-Windows-x64.exe` | Self-contained portable `.exe` (requires no separate .NET runtime) |
          | **Linux (x86_64 GTK4)** | `Our-Family-Field-Guide-Linux-x86_64.tar.gz` | Ubuntu 24.04+ / modern Linux (`glibc 2.39+`, `GTK 4.12+`); run `./install.sh` or build from source on older distros |
          | **Checksums** | `SHA256SUMS.txt` | Verify integrity with `sha256sum -c SHA256SUMS.txt` |

          ### Privacy & Cryptography Highlights
          - **Zero telemetry, zero accounts, zero cloud dependencies** across all 6 apps.
          - **Byte-for-byte compatible encrypted backups:** `PBKDF2-HMAC-SHA256` (250,000 rounds, 16-byte salt) + `AES-256-GCM` (12-byte IV, `ciphertext || 16-byte tag`), plus `GF(256)` 2-of-3 Shamir Split Recovery Cards (`FFG-1-...`).
          - **Built-in Readiness Audits:** Flags accidental raw crypto seed phrases and full national IDs (SSN / Aadhaar).
          NOTES

          python3 -c 'import os, pathlib; p = pathlib.Path("/tmp/release-notes.md"); p.write_text(p.read_text().replace("__ANDROID_APK_NAME__", os.environ["ANDROID_APK_NAME"]).replace("__ANDROID_APK_NOTE__", os.environ["ANDROID_APK_NOTE"]))'

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "Our Family Field Guide $TAG_NAME" --notes-file /tmp/release-notes.md
            gh release upload "$TAG_NAME" release-assets/* --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --title "Our Family Field Guide $TAG_NAME" --notes-file /tmp/release-notes.md --latest
          fi
