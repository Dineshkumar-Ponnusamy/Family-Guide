name: Build Desktop App (Tauri)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            name: windows-x64
            args: ""
          - platform: ubuntu-22.04
            name: linux-x64
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Universal Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Linux WebKitGTK dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Tauri CLI, generate icons & sync web assets
        working-directory: desktop
        run: |
          npm install
          npm run icons
          npm run sync

      - name: Build & attach installers to draft GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: "Our Family Field Guide v__VERSION__"
          releaseBody: "Offline desktop installers for macOS (Universal .dmg), Windows (.msi / .exe), and Linux (.AppImage / .deb). Your data stays 100% local and encrypted."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build installers (manual workflow_dispatch test build)
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: npx tauri build ${{ matrix.args }}

      - name: Upload built installers as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: family-field-guide-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/**/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/**/release/bundle/msi/*.msi
            desktop/src-tauri/target/**/release/bundle/nsis/*.exe
            desktop/src-tauri/target/**/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/**/release/bundle/deb/*.deb
          if-no-files-found: warn
